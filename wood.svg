<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200">
  <!-- wood grain texture for the background -->
  <filter id="wood">
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.09" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.02  0 0 0 0 0  0 0 0 -3 1.9"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#wood)"/>
</svg>
